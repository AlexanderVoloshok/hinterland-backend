services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"
    networks:
      default: {}
      shared:
        aliases:
          - flask-api-backend
    ports:
      - "127.0.0.1:5000:5000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared:
    external: true
    name: shared-services